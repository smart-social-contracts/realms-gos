  </linearGradient>
  <radialGradient id="shade"><stop offset="0" stop-color="#0f172a" stop-opacity=".10"/><stop offset="1" stop-color="#0f172a" stop-opacity="0"/></radialGradient>
  <radialGradient id="landing"><stop offset="0" stop-color="#6BA3A3" stop-opacity=".28"/><stop offset="1" stop-color="#6BA3A3" stop-opacity="0"/></radialGradient>
  <clipPath id="world"><circle cx="800" cy="3100" r="2600"/></clipPath>
</defs>
