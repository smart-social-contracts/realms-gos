name: Create Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Type of release (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      publish_to_registry:
        description: 'Also publish the realm artifacts to the production file_registry (canister_ids.json; the CI key must be a registry publisher)'
        required: false
        type: boolean
        default: false
      skip_version_bump:
        description: 'Use version.txt as-is instead of bumping (for a pre-set semver such as 0.4.1)'
        required: false
        type: boolean
        default: false
      cli_only:
        description: 'Publish the CLI to PyPI only — skip WASM/frontend builds, GitHub release assets, and file_registry'
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest extensions from main
        if: ${{ inputs.cli_only != true }}
        run: git submodule update --remote extensions

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node.js
        if: ${{ inputs.cli_only != true }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # scripts/build_base_wasm.py embeds candid:service metadata with ic-wasm
      # (scripts/embed_candid_metadata.py); same install as realms-e2e.yml.
      - name: Install ic-wasm
        if: ${{ inputs.cli_only != true }}
        run: |
          npm install -g @icp-sdk/ic-wasm
          ic-wasm --version

      - name: Install dfx
        if: ${{ inputs.cli_only != true }}
        run: |
          DFX_VERSION=0.32.0
          curl -fsSL "https://github.com/dfinity/sdk/releases/download/${DFX_VERSION}/dfx-${DFX_VERSION}-x86_64-linux.tar.gz" -o /tmp/dfx.tar.gz
          tar -xzf /tmp/dfx.tar.gz -C /usr/local/bin
          rm /tmp/dfx.tar.gz
          dfx --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install semver build twine
          if [ "${{ inputs.cli_only }}" != "true" ]; then
            pip install -r requirements.txt
            pip install -e cli/
          fi

      - name: Configure dfx identity (Casals CI key)
        if: ${{ inputs.publish_to_registry == true && inputs.cli_only != true }}
        env:
          CASALS_CI_PEM: ${{ secrets.CASALS_CI_PEM }}
          IC_IDENTITY_PEM: ${{ secrets.IC_IDENTITY_PEM }}
        run: |
          PEM="${CASALS_CI_PEM:-$IC_IDENTITY_PEM}"
          if [ -z "$PEM" ]; then
            echo "::error::Neither CASALS_CI_PEM nor IC_IDENTITY_PEM is set." >&2
            exit 1
          fi
          printf '%s' "$PEM" > /tmp/identity.pem
          chmod 600 /tmp/identity.pem
          dfx identity import ci /tmp/identity.pem --storage-mode=plaintext --force
          dfx identity use ci
          rm -f /tmp/identity.pem
          echo "DFX_WARNING=-mainnet_plaintext_identity" >> "$GITHUB_ENV"
          echo "release identity principal: $(dfx identity get-principal)"

      # Bump version (or reuse the version already written to version.txt)
      - name: Bump version
        id: bump_version
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          if [ ! -f "version.txt" ]; then
            echo "0.1.0" > version.txt
          fi

          CURRENT_VERSION=$(cat version.txt)
          if [ "${{ inputs.skip_version_bump }}" = "true" ]; then
            NEW_VERSION="${CURRENT_VERSION}"
            echo "Using pre-set version ${NEW_VERSION} (skip_version_bump)"
          else
            NEW_VERSION=$(python -c "import semver; v=semver.VersionInfo.parse('${CURRENT_VERSION}'); print(v.bump_${{ github.event.inputs.release_type || 'patch' }}())")
            echo "${NEW_VERSION}" > version.txt
            # Anchor at start-of-line so [tool.mypy] python_version is not overwritten.
            sed -i "s/^version = \".*\"/version = \"${NEW_VERSION}\"/" cli/pyproject.toml
            sed -i "s/^__version__ = \".*\"/__version__ = \"${NEW_VERSION}\"/" cli/realms/__init__.py
          fi

          echo "NEW_VERSION=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        run: |
          TAG="v${{ steps.bump_version.outputs.NEW_VERSION }}"
          if gh release view "$TAG" &>/dev/null; then
            echo "❌ ERROR: Release $TAG already exists!"
            exit 1
          fi
          echo "✅ Release $TAG does not exist yet, proceeding..."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Stamp GET /version provenance (gos-as-a-service#39) before packing WASM.
      # Unstamped placeholders are omitted honestly at query time — never invent.
      - name: Stamp /version build provenance
        if: ${{ inputs.cli_only != true }}
        run: |
          SHA=$(git rev-parse --short HEAD)
          BUILT_AT=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          VERSION="v${{ steps.bump_version.outputs.NEW_VERSION }}"
          for f in \
            src/realm_backend/api/version_http.py \
            src/marketplace_backend/api/version_http.py
          do
            sed -i "s/SHA_PLACEHOLDER/${SHA}/g" "$f"
            sed -i "s/BUILT_AT_ISO_PLACEHOLDER/${BUILT_AT}/g" "$f"
            sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" "$f"
          done
          echo "Stamped /version: sha=${SHA} built_at=${BUILT_AT} version=${VERSION}"

      # Build artifacts. The base build defaults to the Cedar template, so the
      # release WASM a new realm pulls from the registry authorizes too.
      - name: Build backend WASM
        if: ${{ inputs.cli_only != true }}
        run: |
          export CANISTER_CANDID_PATH="$(pwd)/src/realm_backend/realm_backend.did"
          python3 scripts/build_base_wasm.py --gzip
          mv .basilisk/realm_backend/realm_backend.wasm.gz ./realm_backend.wasm.gz
          echo "✅ Backend WASM built ($(stat -c%s realm_backend.wasm.gz) bytes)"
          CANISTER_CANDID_PATH="$(pwd)/src/marketplace_backend/marketplace_backend.did" \
            python3 -m basilisk marketplace_backend src/marketplace_backend/main.py
          gzip -kf .basilisk/marketplace_backend/marketplace_backend.wasm
          cp .basilisk/marketplace_backend/marketplace_backend.wasm.gz ./marketplace_backend.wasm.gz
          echo "✅ Marketplace WASM built ($(stat -c%s marketplace_backend.wasm.gz) bytes)"

      - name: Generate Candid declarations
        if: ${{ inputs.cli_only != true }}
        run: |
          mkdir -p src/realm_frontend/src/lib/declarations
          cp -r src/declarations/realm_backend src/realm_frontend/src/lib/declarations/realm_backend
          cp src/realm_backend/realm_backend.did ./realm_backend.did
          echo "✅ Candid declarations copied, DID file ready"

      - name: Build frontend
        if: ${{ inputs.cli_only != true }}
        run: |
          # Workspace install from the repo root (same recipe as realms-e2e.yml):
          # installing inside src/realm_frontend hoists @sveltejs/kit to the root
          # while vite stays nested, and kit then cannot resolve vite. The
          # frontend imports @realmsgos/extension-bridge from its dist/, so build
          # that workspace package first. No REALMS_BUILD_VARIANT = production.
          npm install --legacy-peer-deps
          npm run build --workspace packages/extension-bridge
          (cd src/realm_frontend && npm run build && test -f dist/index.html)
          python3 scripts/check_frontend_variant.py src/realm_frontend/dist production
          # A Casals asset bundle (Casals/docs/BUNDLES.md): canonical tarball with
          # manifest.json inside; its *bundle hash* is what a sheet pins in
          # registry.publish[].sha256 and what /files → Upload bundle verifies.
          # casals_cli.bundle is stdlib-only, so a bare clone is enough.
          git clone --depth 1 https://github.com/smart-social-contracts/Casals /tmp/casals
          (cd /tmp/casals && python3 -m casals_cli.bundle "$GITHUB_WORKSPACE/src/realm_frontend/dist" \
             -o "$GITHUB_WORKSPACE/realm_frontend.tar.gz" --manifest "$GITHUB_WORKSPACE/realm_frontend.manifest.json")
          echo "✅ Frontend bundle built ($(stat -c%s realm_frontend.tar.gz) bytes)"
          (cd src/marketplace_frontend && npm run build && test -f dist/index.html)
          (cd /tmp/casals && python3 -m casals_cli.bundle "$GITHUB_WORKSPACE/src/marketplace_frontend/dist" \
             -o "$GITHUB_WORKSPACE/marketplace_frontend.tar.gz" --manifest "$GITHUB_WORKSPACE/marketplace_frontend.manifest.json")
          echo "✅ Marketplace bundle built ($(stat -c%s marketplace_frontend.tar.gz) bytes)"

      - name: Fetch token wasm
        if: ${{ inputs.cli_only != true }}
        run: |
          # The realm token is ic-tokens, not built from this repo.
          curl -fsSL "https://github.com/smart-social-contracts/ic-tokens/releases/download/v0.1.0/token_backend.wasm.gz" \
            -o token_backend.wasm.gz
          # nft_backend.wasm on that release is uncompressed.
          curl -fsSL "https://github.com/smart-social-contracts/ic-tokens/releases/download/v0.1.0/nft_backend.wasm" \
            -o nft_backend.wasm
          gzip -kf nft_backend.wasm

      # The tag is already in the download URL. The filename carries it too, so a
      # downloaded copy is identifiable: realm-backend-v0.6.0.wasm.gz. v0.6.0 and
      # older releases keep the unversioned names they were published with.
      - name: Stamp the release version on artifact names
        if: ${{ inputs.cli_only != true }}
        env:
          RELEASE_TAG: v${{ steps.bump_version.outputs.NEW_VERSION }}
        run: |
          stamp() {
            local src="$1"
            local raw="${src%%.*}"
            local ext="${src#"$raw"}"
            local stem="${raw//_/-}"
            local dest="${stem}-${RELEASE_TAG}${ext}"
            mv "$src" "$dest"
            echo "$dest"
          }
          for src in \
            realm_backend.wasm.gz \
            realm_backend.did \
            realm_frontend.tar.gz \
            realm_frontend.manifest.json \
            marketplace_backend.wasm.gz \
            marketplace_frontend.tar.gz \
            marketplace_frontend.manifest.json \
            token_backend.wasm.gz \
            nft_backend.wasm.gz
          do
            stamp "$src"
          done

      - name: Compute release asset checksums
        if: ${{ inputs.cli_only != true }}
        env:
          RELEASE_TAG: v${{ steps.bump_version.outputs.NEW_VERSION }}
        run: |
          stamp() {
            local src="$1"
            local raw="${src%%.*}"
            local ext="${src#"$raw"}"
            local stem="${raw//_/-}"
            printf '%s\n' "${stem}-${RELEASE_TAG}${ext}"
          }
          CHECKSUMS="checksums-${RELEASE_TAG}.txt"
          echo "# SHA-256 checksums for release assets" > "$CHECKSUMS"
          for src in realm_backend.wasm.gz realm_backend.did realm_frontend.tar.gz \
                     realm_frontend.manifest.json \
                     marketplace_backend.wasm.gz marketplace_frontend.tar.gz \
                     marketplace_frontend.manifest.json \
                     token_backend.wasm.gz nft_backend.wasm.gz; do
            f="$(stamp "$src")"
            [ -f "$f" ] && sha256sum "$f" >> "$CHECKSUMS"
          done
          cat "$CHECKSUMS"
          RELEASE_TAG="$RELEASE_TAG" python3 - << 'PY' >> "$CHECKSUMS"
          import gzip, hashlib, json, os, pathlib
          tag = os.environ["RELEASE_TAG"]

          def stamped(name: str) -> str:
              stem, _, rest = name.partition(".")
              return f"{stem.replace('_', '-')}-{tag}.{rest}"

          print("# bundle hash (pin this on registry.bundles)")
          for name in ("realm_frontend.tar.gz", "marketplace_frontend.tar.gz"):
              published = stamped(name)
              man = json.load(open(published.replace(".tar.gz", ".manifest.json")))
              print(f"{man['bundle_sha256']}  {published} (bundle)")
          print("# module sha256 (decompressed wasm; pin this on registry.wasms)")
          for name in ("realm_backend.wasm.gz", "marketplace_backend.wasm.gz", "token_backend.wasm.gz", "nft_backend.wasm.gz"):
              published = stamped(name)
              data = gzip.decompress(pathlib.Path(published).read_bytes())
              print(f"{hashlib.sha256(data).hexdigest()}  {published} (module)")
          PY
          BACKEND_HASH=$(awk -v name="realm-backend-${RELEASE_TAG}.wasm.gz" '$2 == name { print $1 }' "$CHECKSUMS")
          FRONTEND_HASH=$(awk -v name="realm-frontend-${RELEASE_TAG}.tar.gz" '$2 == name { print $1 }' "$CHECKSUMS")
          echo "Backend checksum: ${BACKEND_HASH}"
          echo "Frontend tarball checksum: ${FRONTEND_HASH}"

      # A CLI-only run has no release assets to sign, so it publishes the CLI
      # here. Full releases publish it from release-verify.yml once the
      # signed release is published.
      - name: Build and publish CLI to PyPI (CLI only)
        if: ${{ inputs.cli_only == true }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          cd cli
          PYPROJECT_VERSION=$(grep -Po '^version = "\K[^"]*' pyproject.toml)
          INIT_VERSION=$(grep -Po '(?<=__version__ = ")[^"]*' realms/__init__.py)
          if [ "$PYPROJECT_VERSION" != "$INIT_VERSION" ]; then
            echo "ERROR: Version mismatch between pyproject.toml and __init__.py"
            exit 1
          fi
          python -m build
          twine check dist/*
          twine upload dist/*
          echo "✅ CLI published to PyPI: v${{ steps.bump_version.outputs.NEW_VERSION }}"

      # The tag is created when the draft is published, at this commit, so it
      # carries the bumped version files the PyPI build reads.
      - name: Commit and push version changes
        id: version_commit
        run: |
          if [ -f ".github/RELEASE_NOTES_NEXT.md" ]; then
            cp .github/RELEASE_NOTES_NEXT.md "$RUNNER_TEMP/release-notes.md"
          else
            : > "$RUNNER_TEMP/release-notes.md"
          fi
          git add version.txt cli/pyproject.toml cli/realms/__init__.py
          if [ -f ".github/RELEASE_NOTES_NEXT.md" ]; then
            git rm .github/RELEASE_NOTES_NEXT.md
          fi
          if git diff --cached --quiet; then
            echo "No version or release-notes changes to commit"
          else
            git commit -m "chore: bump version to ${{ steps.bump_version.outputs.NEW_VERSION }}"
            git remote set-url origin https://${{ secrets.PAT_GITHUB }}@github.com/${{ github.repository }}.git
            git push origin
            echo "✅ Version changes committed and pushed"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: ${{ inputs.cli_only != true }}
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump_version.outputs.NEW_VERSION }}
          target_commitish: ${{ steps.version_commit.outputs.sha }}
          name: Release v${{ steps.bump_version.outputs.NEW_VERSION }}
          body_path: ${{ runner.temp }}/release-notes.md
          # Stays a draft until the checksum file is signed with the release key
          # (smart-social-contracts/.github scripts/sign-release.sh).
          draft: true
          fail_on_unmatched_files: true
          files: |
            realm-backend-v${{ steps.bump_version.outputs.NEW_VERSION }}.wasm.gz
            realm-backend-v${{ steps.bump_version.outputs.NEW_VERSION }}.did
            realm-frontend-v${{ steps.bump_version.outputs.NEW_VERSION }}.tar.gz
            realm-frontend-v${{ steps.bump_version.outputs.NEW_VERSION }}.manifest.json
            token-backend-v${{ steps.bump_version.outputs.NEW_VERSION }}.wasm.gz
            nft-backend-v${{ steps.bump_version.outputs.NEW_VERSION }}.wasm.gz
            marketplace-backend-v${{ steps.bump_version.outputs.NEW_VERSION }}.wasm.gz
            marketplace-frontend-v${{ steps.bump_version.outputs.NEW_VERSION }}.tar.gz
            marketplace-frontend-v${{ steps.bump_version.outputs.NEW_VERSION }}.manifest.json
            checksums-v${{ steps.bump_version.outputs.NEW_VERSION }}.txt

      # Publish the release artifacts to the production file_registry (the
      # installer serves realms from it). The registry id is the operator
      # inventory's (canister_ids.json, written by `casals export`).
      - name: Publish to file_registry — production
        if: ${{ inputs.publish_to_registry == true && inputs.cli_only != true }}
        run: |
          python3 scripts/publish_build.py \
            --environment production \
            --family realm \
            --component both \
            --version ${{ steps.bump_version.outputs.NEW_VERSION }} \
            --identity ci

      - name: Summary
        run: |
          echo "═══════════════════════════════════════════════════════"
          echo " Release v${{ steps.bump_version.outputs.NEW_VERSION }} complete"
          if [ "${{ inputs.cli_only }}" = "true" ]; then
            echo " PyPI:   https://pypi.org/project/realms-gos/${{ steps.bump_version.outputs.NEW_VERSION }}/"
            echo " scope: CLI / PyPI only"
          else
            echo " Draft:  ${{ steps.create_release.outputs.url }}"
            echo " Sign and publish: sign-release.sh ${{ github.repository }} v${{ steps.bump_version.outputs.NEW_VERSION }}"
            echo " PyPI follows from release-verify.yml once the signature checks out."
          fi
          if [ "${{ inputs.publish_to_registry }}" = "true" ]; then
            echo " file_registry: published to production"
          fi
          echo "═══════════════════════════════════════════════════════"
