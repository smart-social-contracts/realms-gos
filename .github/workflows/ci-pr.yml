# ci-pr.yml — PR / branch CI.
#
# Brings up the full layered mundus on a local replica inside ONE
# runner. The four pipeline stages (bootstrap-infra, publish-artifacts,
# install-mundus, verify-mundus) run sequentially in the same job
# because the local replica is ephemeral — canister ids minted in one
# job don't exist in the next.
#
# For staging / ic the same four stages run as separate reusable
# workflows (see ci-main.yml) since the canisters are long-lived.

name: CI (PR)

on:
  pull_request:
    branches: [main, "feat/**"]
  workflow_dispatch:
    inputs:
      previous_release:
        description: "Release tag whose realm wasm the realm-wasm upgrade tests start from (empty: REALM_PREVIOUS_RELEASE)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"
  NODE_VERSION: "20"
  DFX_VERSION: "0.32.0"
  # The release the realm-wasm job upgrades from: the latest stable one, which the realms in the field run. Pinned, so
  # that publishing a release cannot turn an unrelated PR red. Bump it when a release ships.
  REALM_PREVIOUS_RELEASE: "v0.7.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e cli/ ruff
      # Syntax errors and undefined names only (E9, F63, F7, F82). The full rule set finds 2615 things on this tree and
      # black wants 1114 of 1307 files reformatted (2026-11-17): the two steps that ran them were continue-on-error, so
      # the job was green over all of it. This one is clean today and goes red on a real error.
      - name: Ruff (syntax errors and undefined names)
        run: ruff check --select E9,F63,F7,F82 src/ scripts/ cli/
      - name: actionlint
        uses: raven-actions/actionlint@v2
      - name: No principal / canister-id tables in canister code, scripts or workflows
        # Environment-specific ids live in casals.json and reach a canister at
        # runtime (configure / set_canister_config_json). A table baked into the
        # wasm or a dist points a rebuilt environment at a deleted canister.
        # Test fixtures (tests/, the test-mode seed identity) are exempt, and so is
        # scripts/cycleops (the CycleOps service canister and team principals are
        # not environment ids). The CLI is covered too: a `--network` default
        # table there is the same bug one layer up. The only literals allowed
        # are DFINITY system canisters that are the same on every mainnet alias
        # (Candid UI, Internet Identity, the ICP ledger, and the ckBTC, ckUSDC
        # and ckEURC ledgers + indexes).
        run: |
          if grep -rnoE '\b[a-z0-9]{5}(-[a-z0-9]{5}){3,10}-[a-z0-9]{3}\b' \
               scripts .github src/realm_backend src/*/static src/realm_frontend/src cli/realms dfx.json \
               extensions/extensions/*/frontend-rt/src extensions/dev-server \
               --include='*.py' --include='*.yml' --include='*.sh' --include='*.json' --include='*.ts' --include='*.js' --include='*.svelte' \
               --include='ic-domains' --include='ii-alternative-origins' \
               --exclude-dir=node_modules --exclude-dir=tests --exclude-dir=__pycache__ --exclude-dir=declarations --exclude-dir=dist --exclude-dir=cycleops \
               --exclude=test_identity_seed.py --exclude='*.test.ts' --exclude='*.test.js' \
             | grep -v -- '-xxxxx-' \
             | grep -vE ':(rxs6w-5qaaa-aaaah-avp2a-cai|rdmx6-jaaaa-aaaaa-aaadq-cai|ryjl3-tyaaa-aaaaa-aaaba-cai|mxzaz-hqaaa-aaaar-qaada-cai|n5wcd-faaaa-aaaar-qaaea-cai|xevnm-gaaaa-aaaar-qafnq-cai|xrs4b-hiaaa-aaaar-qafoa-cai|pe5t5-diaaa-aaaar-qahwa-cai|pd4vj-oqaaa-aaaar-qahwq-cai)$'; then
            echo "::error::canister/principal ids belong in casals.json (read them with 'casals export')"; exit 1
          fi

  # The Python unit suites (tests/ggg, tests/backend, the layered codex library, the ratchet and the GGG
  # checks) run in tests.yml and nowhere else. This job keeps the CLI tests, without the library's, and
  # the frontend tests.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # The CLI's own `listings` extra brings h3, so test_listings_command runs.
      - run: pip install -e "cli/[listings]" pytest
      - name: CLI unit tests
        run: pytest -v cli/tests/ --ignore-glob='cli/tests/test_legislation*'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Host frontend i18n tests
        working-directory: src/realm_frontend
        run: |
          npm ci
          npx svelte-kit sync
          npx vitest run src/lib/i18n/localeParity.test.ts \
            src/lib/stores/sidebar.test.ts \
            src/lib/i18n/resolveLocale.test.ts \
            src/lib/utils/backendError.test.ts \
            src/lib/host-bridge.test.ts \
            src/lib/portal-bridge.assistant-prompt.test.ts

  # The packed realm wasms on PocketIC: basilisk stubs typing and struct inside a
  # canister, so only the built artifact shows how the production and the test
  # variant behave (production refuses every test flag, realms-gos#395).
  realm-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          pip install -r requirements.txt
          pip install pytest pocket-ic==3.1.2 cryptography cbor2
      # The verify page's tests (tests/deployed/test_verify_page.py) run its script under Node: 22 or later, for WebCrypto's
      # Ed25519.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The dfx cache carries the pocket-ic server the tests drive.
      - name: Install dfx
        run: |
          curl -fsSL "https://github.com/dfinity/sdk/releases/download/${DFX_VERSION}/dfx-${DFX_VERSION}-x86_64-linux.tar.gz" -o /tmp/dfx.tar.gz
          sudo tar -xzf /tmp/dfx.tar.gz -C /usr/local/bin
          dfx cache install
          echo "POCKET_IC_BIN=$(dfx cache show)/pocket-ic" >> "$GITHUB_ENV"
      # The upgrade tests that start from the previous release's own wasm (test_upgrade_chain, and the "previous" case
      # of the others) read it from REALM_PREVIOUS_WASM and skip without it, which they did on every run until this
      # step. A release without the asset fails here rather than letting them skip again. A dispatch may name another
      # release, such as the one a given canister runs.
      - name: The previous release's realm wasm
        env:
          TAG: ${{ inputs.previous_release || env.REALM_PREVIOUS_RELEASE }}
        run: |
          dir="$RUNNER_TEMP/previous-release"
          mkdir -p "$dir" && cd "$dir"
          for asset in "realm-backend-$TAG.wasm.gz" "checksums-$TAG.txt"; do
            curl -fsSL -o "$asset" "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$asset" \
              || { echo "::error::release $TAG has no $asset, which the upgrade tests install"; exit 1; }
          done
          sha256sum --check --ignore-missing "checksums-$TAG.txt"
          gunzip "realm-backend-$TAG.wasm.gz"
          echo "REALM_PREVIOUS_WASM=$dir/realm-backend-$TAG.wasm" >> "$GITHUB_ENV"
      # Not run against the previous release yet, tracked in realms-gos#727: delete a line once its test passes there.
      # - test_upgrade_chain upgrades a realm of the release to this one, and a migration traps in post_upgrade.
      # - The others seed the release's realm through the read and run endpoints, which no release has yet (they came
      #   after v0.8.0-rc3), so they fail before they reach the upgrade.
      - name: Realm wasms on PocketIC
        run: >-
          pytest -q tests/deployed
          --deselect 'tests/deployed/test_upgrade_chain.py::test_a_realm_upgraded_before_upgrades_to_this_release'
          --deselect 'tests/deployed/test_audit_log.py::test_the_log_of_the_previous_release_is_read_as_before_after_the_upgrade[previous]'
          --deselect 'tests/deployed/test_audit_log.py::test_updates_after_the_upgrade_drop_its_events_cheaply_and_leave_nothing_of_them[previous]'
          --deselect 'tests/deployed/test_delegation_groups.py::test_a_grant_made_before_groups_works_as_it_did'
          --deselect 'tests/deployed/test_delegation_groups.py::test_events_written_before_the_upgrade_read_grant_as_empty'
          --deselect 'tests/deployed/test_delegation_groups.py::test_what_the_upgrade_adds_to_a_delegated_vote'
          --deselect 'tests/deployed/test_fastjson.py::test_a_layered_codex_id_does_not_change_across_the_upgrade_to_the_fast_json'
          --deselect 'tests/deployed/test_g2_finance.py::test_a_budget_is_proposed_per_period_with_its_totals_as_facts[previous]'
          --deselect 'tests/deployed/test_g2_finance.py::test_a_budget_whose_total_is_out_of_range_is_refused_and_files_nothing[previous]'
          --deselect 'tests/deployed/test_g2_finance.py::test_activating_a_codex_needs_a_pending_one[previous]'
          --deselect 'tests/deployed/test_g2_finance.py::test_a_line_joins_a_pending_invoice[previous]'
          --deselect 'tests/deployed/test_g2_finance.py::test_a_loan_is_the_debt_of_the_realm_until_repaid[previous]'
          --deselect 'tests/deployed/test_g2_finance.py::test_a_number_outside_its_range_is_refused_before_anything_is_written[previous]'
          --deselect 'tests/deployed/test_g2_finance.py::test_a_scheduled_transfer_is_owed_until_it_is_paid_or_cancelled[previous]'
          --deselect 'tests/deployed/test_g2_finance.py::test_a_second_upgrade_changes_nothing[previous]'
          --deselect 'tests/deployed/test_g2_finance.py::test_a_transfer_of_the_release_before_is_found_by_its_contract_once_the_upgrade_has_read_it[previous]'
          --deselect 'tests/deployed/test_g2_finance.py::test_budget_extend_carries_the_budget_of_the_period_before_and_only_once[previous]'
          --deselect 'tests/deployed/test_g2_finance.py::test_each_invoice_has_one_item_for_its_whole_amount[previous]'
          --deselect 'tests/deployed/test_g2_finance.py::test_money_is_staged_on_a_line_and_charged_to_it_from_the_committed_money_or_the_credit[previous]'
          --deselect 'tests/deployed/test_g2_finance.py::test_tax_assess_bills_the_items_of_the_migrated_policy_rounded_to_the_cent[previous]'
          --deselect 'tests/deployed/test_g2_finance.py::test_tax_declare_adds_up_the_brackets_of_a_progressive_tax_and_rounds_the_total_once[previous]'
          --deselect 'tests/deployed/test_g2_finance.py::test_the_budget_lines_are_revenue_or_expense_by_what_they_were_called[previous]'
          --deselect 'tests/deployed/test_g2_finance.py::test_the_payments_on_a_contract_never_exceed_its_value[previous]'
          --deselect 'tests/deployed/test_g2_finance.py::test_the_rows_start_in_the_form_of_the_last_release[previous]'
          --deselect 'tests/deployed/test_g2_finance.py::test_the_tax_policy_keeps_its_taxes_as_typed_entries[previous]'
          --deselect 'tests/deployed/test_g2_finance.py::test_the_treasury_owes_nothing_and_the_parcel_is_not_assessed[previous]'
          --deselect 'tests/deployed/test_index_upgrade.py::test_a_converted_list_is_read_and_paged_in_few_instructions[previous]'
          --deselect 'tests/deployed/test_index_upgrade.py::test_a_finished_realm_answers_at_once_and_only_the_host_runs_it[previous]'
          --deselect 'tests/deployed/test_index_upgrade.py::test_a_query_before_the_conversion_runs_out_of_instructions[previous]'
          --deselect 'tests/deployed/test_index_upgrade.py::test_a_rollback_to_the_previous_release_reads_the_converted_lists_as_empty[previous]'
          --deselect 'tests/deployed/test_index_upgrade.py::test_members_votes_and_proposals_are_the_same_after_the_conversion[previous]'
          --deselect 'tests/deployed/test_index_upgrade.py::test_the_lists_start_in_the_form_of_the_earlier_release[previous]'
          --deselect 'tests/deployed/test_index_upgrade.py::test_the_op_converts_every_list_in_batches_and_loses_no_id[previous]'
          --deselect 'tests/deployed/test_installs.py::test_l_an_install_begun_on_the_previous_release_finishes_after_the_upgrade'
          --deselect 'tests/deployed/test_journal_signing.py::test_n_a_realm_upgraded_from_the_release_that_signed_every_day_keeps_its_signed_days_and_stops_signing_by_itself'
          --deselect 'tests/deployed/test_layered_codex.py::test_a_legacy_codex_stays_active_and_installable_across_the_upgrade'
          --deselect 'tests/deployed/test_legislation_runtime.py::test_l_a_federal_revert_in_flight_across_the_upgrade_keeps_its_leg_reserved'
          --deselect 'tests/deployed/test_proposal_tag_index.py::test_an_upgrade_after_a_rollback_puts_right_what_the_release_before_filed_and_retagged[previous]'
          --deselect 'tests/deployed/test_proposal_tag_index.py::test_a_page_of_a_common_tag_and_the_pages_after_it_follow_the_order_of_an_unfiltered_list[previous]'
          --deselect 'tests/deployed/test_proposal_tag_index.py::test_a_page_of_the_rare_tag_is_full_in_one_call_and_costs_what_it_holds[previous]'
          --deselect 'tests/deployed/test_proposal_tag_index.py::test_a_tag_of_64_four_byte_characters_is_filed_and_found[previous]'
          --deselect 'tests/deployed/test_proposal_tag_index.py::test_a_tag_that_ends_like_an_index_entry_hides_no_proposal[previous]'
          --deselect 'tests/deployed/test_proposal_tag_index.py::test_filing_a_proposal_costs_the_lists_of_its_tags[previous]'
          --deselect 'tests/deployed/test_proposal_tag_index.py::test_the_pass_lists_every_proposal_a_message_at_a_time_and_then_stops[previous]'
          --deselect 'tests/deployed/test_proposal_tag_index.py::test_the_realm_answers_by_tag_whether_or_not_the_pass_has_listed_the_proposals[previous]'
          --deselect 'tests/deployed/test_proposal_tag_index.py::test_with_a_status_the_tags_pages_are_still_full_and_read_from_the_shorter_list[previous]'
          --deselect 'tests/deployed/test_quarter_sync_rollback.py::test_a_quarter_whose_capital_was_rolled_back_and_upgraded_again_catches_up_in_one_sync'
          --deselect 'tests/deployed/test_voting_rule.py::test_the_proposals_of_the_last_release_are_decided_by_the_rule_they_were_filed_under[previous]'

  # casals up from an empty replica, one extension put on the marketplace and verified, then the
  # standalone realm UI suite in a browser. The job body is realms-e2e.yml (also runnable by hand via
  # workflow_dispatch); its cross-quarter step skips itself while casals.local.json has no
  # demo-backend.
  e2e:
    needs: [lint, unit]
    uses: ./.github/workflows/realms-e2e.yml
