# ci-pr.yml — PR / branch CI.
#
# Brings up the full layered mundus on a local replica inside ONE
# runner. The four pipeline stages (bootstrap-infra, publish-artifacts,
# install-mundus, verify-mundus) run sequentially in the same job
# because the local replica is ephemeral — canister ids minted in one
# job don't exist in the next.
#
# For staging / ic the same four stages run as separate reusable
# workflows (see ci-main.yml) since the canisters are long-lived.

name: CI (PR)

on:
  pull_request:
    branches: [main, "feat/**"]
  workflow_dispatch:
    inputs:
      previous_release:
        description: "Release tag whose realm wasm the realm-wasm upgrade tests start from (empty: REALM_PREVIOUS_RELEASE)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"
  NODE_VERSION: "20"
  DFX_VERSION: "0.32.0"
  # The release the realm-wasm job upgrades from: the latest stable one. Pinned, so that publishing a release cannot
  # turn an unrelated PR red. Every release so far runs the realm backend this one replaced, whose realms are refused
  # an upgrade (docs/deployment/README.md, "Realms of the releases up to v0.8.0-rc3"): test_upgrade_chain checks the
  # refusal. Bump it when a release ships.
  REALM_PREVIOUS_RELEASE: "v0.7.0"
  # The build of this realm backend that test_upgrade_chain upgrades from, until a release of it exists: the oldest any
  # realm runs (local-a5135eb6, staging, November 2026), packed byte for byte as it was built for them. Its
  # requirements leave the toolkit open (>=0.5.3), so the version it was built with is pinned here, and the packed wasm,
  # gzipped as `gzip -n -9`, must have the module hash those realms report (`icp canister status --public`). The test's
  # seed is written for this build's API: moving it on means a new seed, not only a new commit.
  REALM_PREVIOUS_COMMIT: "a5135eb631c71c6772aa95051b17f181642bbbe5"
  REALM_PREVIOUS_TOOLKIT: "0.5.3"
  REALM_PREVIOUS_MODULE: "b0bfada748b8c45003933c9dc0c56eb2a57d3bf34f79f5a00c2d859a3c42a0db"
  # `icp network start` resolves the network launcher through
  # api.github.com/repos/dfinity/icp-cli-network-launcher/releases/latest. Unauthenticated that
  # is 60 requests an hour per runner IP, and it has failed the job with a bare
  # "403 rate limit exceeded" on unrelated PRs. The CLI reads a token from this variable.
  ICP_CLI_GITHUB_TOKEN: ${{ github.token }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e cli/ ruff
      # Syntax errors and undefined names only (E9, F63, F7, F82). The full rule set finds 2615 things on this tree and
      # black wants 1114 of 1307 files reformatted (2026-11-17): the two steps that ran them were continue-on-error, so
      # the job was green over all of it. This one is clean today and goes red on a real error.
      - name: Ruff (syntax errors and undefined names)
        run: ruff check --select E9,F63,F7,F82 src/ scripts/ cli/
      - name: actionlint
        uses: raven-actions/actionlint@v2
      - name: No principal / canister-id tables in canister code, scripts or workflows
        # Environment-specific ids live in casals.json and reach a canister at
        # runtime (configure / set_canister_config_json). A table baked into the
        # wasm or a dist points a rebuilt environment at a deleted canister.
        # Test fixtures (tests/, the test-mode seed identity) are exempt, and so is
        # scripts/cycleops (the CycleOps service canister and team principals are
        # not environment ids). The CLI is covered too: a `--network` default
        # table there is the same bug one layer up. The only literals allowed
        # are DFINITY system canisters that are the same on every mainnet alias
        # (Candid UI, Internet Identity and its id.ai frontend, which icp-cli's
        # local network installs at the same ids, the ICP ledger, and the ckBTC,
        # ckUSDC and ckEURC ledgers + indexes).
        run: |
          if grep -rnoE '\b[a-z0-9]{5}(-[a-z0-9]{5}){3,10}-[a-z0-9]{3}\b' \
               scripts .github src/realm_backend src/*/static src/realm_frontend/src cli/realms dfx.json \
               extensions/extensions/*/frontend-rt/src extensions/dev-server \
               --include='*.py' --include='*.yml' --include='*.sh' --include='*.json' --include='*.ts' --include='*.js' --include='*.svelte' \
               --include='ic-domains' --include='ii-alternative-origins' \
               --exclude-dir=node_modules --exclude-dir=tests --exclude-dir=__pycache__ --exclude-dir=declarations --exclude-dir=dist --exclude-dir=cycleops \
               --exclude=test_identity_seed.py --exclude='*.test.ts' --exclude='*.test.js' \
             | grep -v -- '-xxxxx-' \
             | grep -vE ':(rxs6w-5qaaa-aaaah-avp2a-cai|rdmx6-jaaaa-aaaaa-aaadq-cai|uqzsh-gqaaa-aaaaq-qaada-cai|ryjl3-tyaaa-aaaaa-aaaba-cai|mxzaz-hqaaa-aaaar-qaada-cai|n5wcd-faaaa-aaaar-qaaea-cai|xevnm-gaaaa-aaaar-qafnq-cai|xrs4b-hiaaa-aaaar-qafoa-cai|pe5t5-diaaa-aaaar-qahwa-cai|pd4vj-oqaaa-aaaar-qahwq-cai)$'; then
            echo "::error::canister/principal ids belong in casals.json (read them with 'casals export')"; exit 1
          fi

  # The Python unit suites (tests/ggg, tests/backend, the layered codex library, the ratchet and the GGG
  # checks) run in tests.yml and nowhere else. This job keeps the CLI tests, without the library's, and
  # the frontend tests.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # The CLI's own `listings` extra brings h3, so test_listings_command runs.
      - run: pip install -e "cli/[listings]" pytest
      - name: CLI unit tests
        run: pytest -v cli/tests/ --ignore-glob='cli/tests/test_legislation*'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Host frontend i18n tests
        working-directory: src/realm_frontend
        run: |
          npm ci
          npx svelte-kit sync
          npx vitest run src/lib/i18n/localeParity.test.ts \
            src/lib/stores/sidebar.test.ts \
            src/lib/i18n/resolveLocale.test.ts \
            src/lib/utils/backendError.test.ts \
            src/lib/host-bridge.test.ts \
            src/lib/portal-bridge.assistant-prompt.test.ts \
            src/lib/components/DemoDataBanner.test.ts

  # The packed realm wasms on PocketIC: basilisk stubs typing and struct inside a
  # canister, so only the built artifact shows how the production and the test
  # variant behave (production refuses every test flag, realms-gos#395).
  realm-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          pip install -r requirements.txt
          pip install pytest pocket-ic==3.1.2 cryptography cbor2
      # The verify page's tests (tests/deployed/test_verify_page.py) run its script under Node: 22 or later, for WebCrypto's
      # Ed25519.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The dfx cache carries the pocket-ic server the tests drive.
      - name: Install dfx
        run: |
          curl -fsSL "https://github.com/dfinity/sdk/releases/download/${DFX_VERSION}/dfx-${DFX_VERSION}-x86_64-linux.tar.gz" -o /tmp/dfx.tar.gz
          sudo tar -xzf /tmp/dfx.tar.gz -C /usr/local/bin
          dfx cache install
          echo "POCKET_IC_BIN=$(dfx cache show)/pocket-ic" >> "$GITHUB_ENV"
      # test_upgrade_chain reads the previous release's own wasm from REALM_PREVIOUS_WASM, to check that the upgrade of
      # its realms is refused, and would skip without it. A release without the asset fails here rather than letting it
      # skip. A dispatch may name another release, such as the one a given canister runs.
      - name: The previous release's realm wasm
        env:
          TAG: ${{ inputs.previous_release || env.REALM_PREVIOUS_RELEASE }}
        run: |
          dir="$RUNNER_TEMP/previous-release"
          mkdir -p "$dir" && cd "$dir"
          for asset in "realm-backend-$TAG.wasm.gz" "checksums-$TAG.txt"; do
            curl -fsSL -o "$asset" "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$asset" \
              || { echo "::error::release $TAG has no $asset, which the upgrade tests install"; exit 1; }
          done
          sha256sum --check --ignore-missing "checksums-$TAG.txt"
          gunzip "realm-backend-$TAG.wasm.gz"
          echo "REALM_PREVIOUS_WASM=$dir/realm-backend-$TAG.wasm" >> "$GITHUB_ENV"
      # The wasm of the earlier build test_upgrade_chain upgrades from (REALM_PREVIOUS_BUILD_WASM), packed from its own
      # tree with the dependencies it was built with, and checked against the module its realms run. It does not
      # change, so it is packed once and kept in the cache; the check runs on a cached copy too.
      - name: The previous build's realm wasm, cached
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/previous-build/realm_backend.wasm
          key: realm-previous-build-${{ env.REALM_PREVIOUS_COMMIT }}-toolkit-${{ env.REALM_PREVIOUS_TOOLKIT }}
      - name: The previous build's realm wasm
        run: |
          dir="$RUNNER_TEMP/previous-build"
          if [ ! -f "$dir/realm_backend.wasm" ]; then
            git fetch --no-tags --depth=1 origin "$REALM_PREVIOUS_COMMIT"
            mkdir -p "$dir/tree"
            git archive "$REALM_PREVIOUS_COMMIT" | tar -x -C "$dir/tree"
            python -m venv "$dir/venv"
            "$dir/venv/bin/pip" install -q -r "$dir/tree/requirements.txt" "ic-basilisk-toolkit==$REALM_PREVIOUS_TOOLKIT"
            (cd "$dir/tree" && "$dir/venv/bin/python" scripts/pack_realm_backend.py --version "local-${REALM_PREVIOUS_COMMIT:0:8}")
            cp "$dir/tree/.basilisk/realm_backend/realm_backend.wasm" "$dir/realm_backend.wasm"
          fi
          module=$(gzip -n -9 -c "$dir/realm_backend.wasm" | sha256sum | cut -d' ' -f1)
          if [ "$module" != "$REALM_PREVIOUS_MODULE" ]; then
            echo "::error::the packed previous build is module $module, not $REALM_PREVIOUS_MODULE, which its realms run"
            exit 1
          fi
          echo "REALM_PREVIOUS_BUILD_WASM=$dir/realm_backend.wasm" >> "$GITHUB_ENV"
      # The upgrade tests start from REALM_PREVIOUS_BUILD_WASM. A case that needs what that build lacks says so in its
      # own skip, with the reason (realms-gos#792).
      - name: Realm wasms on PocketIC
        run: pytest -q tests/deployed

  # casals up from an empty replica, one extension put on the marketplace and verified, then the
  # standalone realm UI suite in a browser. The job body is realms-e2e.yml (also runnable by hand via
  # workflow_dispatch); its cross-quarter step skips itself while casals.local.json has no
  # demo-backend.
  e2e:
    needs: [lint, unit]
    uses: ./.github/workflows/realms-e2e.yml
