# ci-pr.yml — PR / branch CI.
#
# Brings up the full layered mundus on a local replica inside ONE
# runner. The four pipeline stages (bootstrap-infra, publish-artifacts,
# install-mundus, verify-mundus) run sequentially in the same job
# because the local replica is ephemeral — canister ids minted in one
# job don't exist in the next.
#
# For staging / ic the same four stages run as separate reusable
# workflows (see ci-main.yml) since the canisters are long-lived.

name: CI (PR)

on:
  # pull_request:
  #   branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"
  NODE_VERSION: "20"
  DFX_VERSION: "0.32.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e cli/ ruff black
      - name: Ruff
        run: ruff check src/ scripts/ cli/
        continue-on-error: true
      - name: Black --check
        run: black --check src/ scripts/ cli/
        continue-on-error: true
      - name: actionlint
        uses: raven-actions/actionlint@v2
      - name: No principal / canister-id tables in canister code, scripts or workflows
        # Environment-specific ids live in casals.json and reach a canister at
        # runtime (configure / set_canister_config_json). A table baked into the
        # wasm or a dist points a rebuilt environment at a deleted canister.
        # Test fixtures (tests/, the test-mode seed identity) are exempt, and so is
        # scripts/cycleops (the CycleOps service canister and team principals are
        # not environment ids). The CLI is covered too: a `--network` default
        # table there is the same bug one layer up. The only literals allowed
        # are DFINITY system canisters that are the same on every mainnet alias
        # (Candid UI, Internet Identity, ckBTC ledger + index).
        run: |
          if grep -rnoE '\b[a-z0-9]{5}(-[a-z0-9]{5}){3,10}-[a-z0-9]{3}\b' \
               scripts .github src/realm_backend src/*/static src/realm_frontend/src cli/realms dfx.json \
               extensions/extensions/*/frontend-rt/src extensions/dev-server \
               --include='*.py' --include='*.yml' --include='*.sh' --include='*.json' --include='*.ts' --include='*.js' --include='*.svelte' \
               --include='ic-domains' --include='ii-alternative-origins' \
               --exclude-dir=node_modules --exclude-dir=tests --exclude-dir=__pycache__ --exclude-dir=declarations --exclude-dir=dist --exclude-dir=cycleops \
               --exclude=test_identity_seed.py --exclude='*.test.ts' --exclude='*.test.js' \
             | grep -v -- '-xxxxx-' \
             | grep -vE 'rxs6w-5qaaa-aaaah-avp2a-cai|rdmx6-jaaaa-aaaaa-aaadq-cai|mxzaz-hqaaa-aaaar-qaada-cai|n5wcd-faaaa-aaaar-qaaea-cai'; then
            echo "::error::canister/principal ids belong in casals.json (read them with 'casals export')"; exit 1
          fi

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          pip install -e cli/
          pip install -r requirements.txt
          pip install pytest
      - name: CLI unit tests
        run: pytest -v cli/tests/ || true
      - name: Extension privilege ratchet
        # Blocking on purpose: these are pure source scans and in-memory unit
        # tests with no canister or DB, so a failure here is a real
        # regression. The exemption list may only shrink, no extension may
        # take the caller's identity from its own call args, every bridge verb
        # must keep checking the caller's operation host-side, and no verb may
        # be dispatched without its call origin.
        run: |
          python3 scripts/declare_extension_runtime.py --check
          pytest -q tests/backend/test_extension_caller_identity.py \
                    tests/backend/test_sandbox_exemption_ratchet.py \
                    tests/backend/test_extension_manifest_contract.py \
                    tests/backend/test_extension_bridge.py \
                    tests/backend/test_extension_bridge_verbs.py \
                    tests/backend/test_extension_owned_entities.py \
                    tests/backend/test_land_bridge.py \
                    tests/backend/test_extension_grants.py \
                    tests/backend/test_notification_bridge.py \
                    tests/backend/test_console_bridge.py \
                    tests/backend/test_async_bridge.py \
                    tests/backend/test_treasury_bridge.py \
                    tests/backend/test_procurement_bridge.py \
                    tests/backend/test_procurement_sandboxed.py \
                    tests/backend/test_justice_bridge.py \
                    tests/backend/test_justice_sandboxed.py \
                    tests/backend/test_sandbox_package_bundle.py \
                    tests/backend/department_docs/ \
                    tests/backend/test_time_utils.py \
                    tests/backend/test_call_origin.py \
                    tests/backend/test_ggg_sdk_json_shim.py \
                    tests/backend/test_sidebar_visibility.py \
                    tests/backend/test_repl_host.py \
                    tests/backend/test_repl_ui_parity.py \
                    tests/backend/test_shell_access_denied.py \
                    tests/backend/test_department_table.py \
                    tests/backend/test_no_module_level_re.py \
                    tests/backend/test_proposal_dispatch_orchestration.py \
                    tests/backend/test_delegation.py
      - name: Tax policy
        # Its own process: these load the real ggg entities, which the run
        # above replaces with the CLI's mock module.
        run: |
          pytest -q tests/backend/test_taxation.py \
                    tests/backend/test_tax_bridge.py \
                    tests/backend/test_agora_tax_assessment.py
      - name: Test-flag ratchet
        # Blocking on purpose: these are source and config scans that keep the
        # removed authentication bypass deleted, keep can_test_mode out of the
        # unauthenticated test_flags payload, and keep the network gate an
        # allowlist that fails closed. See realms#395.
        run: |
          pytest -q tests/backend/test_test_flag_ratchet.py \
                    tests/backend/test_runtime_flags.py \
                    tests/backend/test_build_variant.py \
                    tests/backend/test_descriptor_flag_map.py
          pytest -q tests/backend/test_access_control.py
      - name: Cedar policy drift
        # The embedded policy text the canister runs must mirror the .cedar
        # source files; a stale copy silently changes what a realm enforces.
        run: |
          python3 scripts/sync_cedar_policies.py --check
      - name: GGG interface
        # The generated GGG methods must match ggg/ggg.did, and every operation must pass
        # tests/ggg. Its own process: its fake chain replaces the ggg entities loaded above.
        run: |
          python3 scripts/ggg_candid.py --check
          pytest -q tests/ggg
          # Again, each operation through its ggg_ method, every reply checked against ggg.did.
          GGG_MIRROR=strict pytest -q tests/ggg
      - name: Host locale parity and sidebar labels
        run: |
          pytest -q tests/backend/test_sidebar_labels.py \
                    tests/backend/test_api_errors.py \
                    tests/backend/test_extension_i18n_packs.py
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/realm_frontend/package-lock.json
      - name: Host frontend i18n tests
        working-directory: src/realm_frontend
        run: |
          npm ci
          npx vitest run src/lib/i18n/localeParity.test.ts \
            src/lib/stores/sidebar.test.ts \
            src/lib/i18n/resolveLocale.test.ts \
            src/lib/utils/backendError.test.ts

  # casals up from an empty replica + the cross-quarter live suite; the job
  # body is realms-e2e.yml (also runnable by hand via workflow_dispatch).
  e2e:
    needs: [lint, unit]
    uses: ./.github/workflows/realms-e2e.yml
