# ci-pr.yml — PR / branch CI.
#
# Brings up the full layered mundus on a local replica inside ONE
# runner. The four pipeline stages (bootstrap-infra, publish-artifacts,
# install-mundus, verify-mundus) run sequentially in the same job
# because the local replica is ephemeral — canister ids minted in one
# job don't exist in the next.
#
# For staging / ic the same four stages run as separate reusable
# workflows (see ci-main.yml) since the canisters are long-lived.

name: CI (PR)

on:
  # pull_request:
  #   branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"
  NODE_VERSION: "20"
  DFX_VERSION: "0.32.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e cli/ ruff black
      - name: Ruff
        run: ruff check src/ scripts/ cli/
        continue-on-error: true
      - name: Black --check
        run: black --check src/ scripts/ cli/
        continue-on-error: true
      - name: actionlint
        uses: raven-actions/actionlint@v2
      - name: No principal / canister-id tables in canister code, scripts or workflows
        # Environment-specific ids live in casals.json and reach a canister at
        # runtime (configure / set_canister_config_json). A table baked into the
        # wasm or a dist points a rebuilt environment at a deleted canister.
        # Test fixtures (tests/, the test-mode seed identity) are exempt, and so is
        # scripts/cycleops (the CycleOps service canister and team principals are
        # not environment ids). The CLI is covered too: a `--network` default
        # table there is the same bug one layer up. The only literals allowed
        # are DFINITY system canisters that are the same on every mainnet alias
        # (Candid UI, Internet Identity, ckBTC ledger + index).
        run: |
          if grep -rnoE '\b[a-z0-9]{5}(-[a-z0-9]{5}){3,10}-[a-z0-9]{3}\b' \
               scripts .github src/realm_backend src/*/static src/realm_frontend/src cli/realms dfx.json \
               extensions/extensions/*/frontend-rt/src extensions/dev-server \
               --include='*.py' --include='*.yml' --include='*.sh' --include='*.json' --include='*.ts' --include='*.js' --include='*.svelte' \
               --include='ic-domains' --include='ii-alternative-origins' \
               --exclude-dir=node_modules --exclude-dir=tests --exclude-dir=__pycache__ --exclude-dir=declarations --exclude-dir=dist --exclude-dir=cycleops \
               --exclude=test_identity_seed.py --exclude='*.test.ts' --exclude='*.test.js' \
             | grep -v -- '-xxxxx-' \
             | grep -vE 'rxs6w-5qaaa-aaaah-avp2a-cai|rdmx6-jaaaa-aaaaa-aaadq-cai|mxzaz-hqaaa-aaaar-qaada-cai|n5wcd-faaaa-aaaar-qaaea-cai'; then
            echo "::error::canister/principal ids belong in casals.json (read them with 'casals export')"; exit 1
          fi

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          pip install -e cli/
          pip install -r requirements.txt
          pip install pytest pytest-cov cedarpy==4.12.2
      - name: CLI unit tests
        run: pytest -v cli/tests/ || true
      - name: Extension sandbox ratchet
        # Blocking on purpose: the list of extensions that still import host modules may only shrink.
        run: python3 scripts/declare_extension_runtime.py --check
      - name: tests/backend
        # The whole directory, not a list: a test added there runs. Source scans and contracts of the
        # extensions, codices and build variants, with no canister or DB. The build-variant tests are blocking
        # on purpose: the checked-in variant is production, the test gate fails closed, and the packer's wasm
        # scan works in both directions (realms-gos#395). marketplace/ has its own step until the realm backend pins ic-python-db 0.14.0 as well (realms-gos#541).
        run: pytest -q tests/backend --ignore=tests/backend/marketplace
      - name: Marketplace (temporary)
        # Its own environment: the marketplace canister pins ic-python-db 0.14.0. Remove this step and
        # the --ignore above once #541 has merged.
        run: |
          python -m venv /tmp/marketplace-env
          /tmp/marketplace-env/bin/pip install -r src/marketplace_backend/requirements.txt pytest
          /tmp/marketplace-env/bin/pytest -q tests/backend/marketplace
      - name: GGG interface
        # The generated GGG methods must match ggg/ggg.did, and every operation must pass
        # tests/ggg. Its own process: its fake chain replaces the ggg entities loaded above.
        run: |
          python3 scripts/ggg_candid.py --check
          # The bundled time zones are what the pinned tz database gives: it is downloaded, checked against its sha512
          # and built here (needs make and a C compiler).
          python3 scripts/build_zones.py --check
          pytest -q tests/ggg --cov=src/realm_backend --cov-report=
          # Again, each operation through its ggg_ method, every reply checked against ggg.did.
          GGG_MIRROR=strict pytest -q tests/ggg
      - name: GGG coverage floors
        # A ratchet, not a target: each floor is the level reached when it was set, so coverage can
        # only go up. Raise a floor when the number above it grows; ggg_api.py is lowest while the
        # mirror harness (tests/ggg/mirror.py) still reports mismatches. Generated files are left out.
        run: |
          coverage report --include='src/realm_backend/api/*' --fail-under=95
          coverage report --include='src/realm_backend/ggg_api.py' --fail-under=60
          coverage report --omit='src/realm_backend/ggg_did.py,src/realm_backend/ggg_methods.py' --skip-covered
          coverage xml -o coverage-ggg.xml --omit='src/realm_backend/ggg_did.py,src/realm_backend/ggg_methods.py'
      - name: Upload the GGG coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ggg
          path: coverage-ggg.xml
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/realm_frontend/package-lock.json
      - name: Host frontend i18n tests
        working-directory: src/realm_frontend
        run: |
          npm ci
          npx vitest run src/lib/i18n/localeParity.test.ts \
            src/lib/stores/sidebar.test.ts \
            src/lib/i18n/resolveLocale.test.ts \
            src/lib/utils/backendError.test.ts

  # The packed realm wasms on PocketIC: basilisk stubs typing and struct inside a
  # canister, so only the built artifact shows how the production and the test
  # variant behave (production refuses every test flag, realms-gos#395).
  realm-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          pip install -r requirements.txt
          pip install pytest pocket-ic==3.1.2
      # The dfx cache carries the pocket-ic server the tests drive.
      - name: Install dfx
        run: |
          curl -fsSL "https://github.com/dfinity/sdk/releases/download/${DFX_VERSION}/dfx-${DFX_VERSION}-x86_64-linux.tar.gz" -o /tmp/dfx.tar.gz
          sudo tar -xzf /tmp/dfx.tar.gz -C /usr/local/bin
          dfx cache install
          echo "POCKET_IC_BIN=$(dfx cache show)/pocket-ic" >> "$GITHUB_ENV"
      - name: Realm wasms on PocketIC
        run: pytest -q tests/deployed

  # casals up from an empty replica + the cross-quarter live suite; the job
  # body is realms-e2e.yml (also runnable by hand via workflow_dispatch).
  e2e:
    needs: [lint, unit]
    uses: ./.github/workflows/realms-e2e.yml
