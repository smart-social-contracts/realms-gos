# ci-main.yml — main pipeline: casals up on a local replica + the cross-quarter
# live suite (realms-e2e.yml). Live environments are built by hand with
# `casals up -e production` and released with `casals upgrade`
# (docs/deployment/README.md); nothing here deploys.

name: CI (main)

on:
  # push:
  #   branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-main
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.10"
  NODE_VERSION: "20"

jobs:
  # ── E2E on a local replica: casals up + cross-quarter live suite ───────────
  e2e:
    uses: ./.github/workflows/realms-e2e.yml
