# publish-build.yml — build and publish a realm/infra release into an
# environment's file_registry (manually triggered).
#
# This does NOT deploy to any canister: the installer serves new realms from
# the file_registry. Existing canisters move only when an operator runs
# `casals upgrade casals.json --wasm <family> | --content <namespace>`
# (docs/deployment/README.md); `casals up` builds the sheet on day one and is not a
# release tool. The registry id comes from the operator inventory
# (canister_ids.json) unless file_registry is given.

name: Publish Build

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment / dfx network (also the canister_ids.json key)"
        required: true
        type: choice
        default: production
        options:
          - production
      file_registry:
        description: "file_registry canister id (blank = canister_ids.json[file_registry][environment])"
        required: false
        default: ""
      family:
        description: "Artifact family"
        required: true
        type: choice
        default: realm
        options:
          - realm
          - file-registry
          - dashboard
          - marketplace
      component:
        description: "Which component(s) to build + publish"
        required: true
        type: choice
        default: both
        options:
          - both
          - backend
          - frontend
      version:
        description: "Release version (e.g. 0.4.0); ignored when from_main is true"
        required: false
        default: ""
      from_main:
        description: "Publish current checkout as main.<ts>.<sha> instead of a semver"
        required: false
        type: boolean
        default: false

concurrency:
  group: publish-build-${{ inputs.environment }}-${{ inputs.family }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.10"
  NODE_VERSION: "20"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dfx
        run: |
          DFX_VERSION=0.32.0
          curl -fsSL "https://github.com/dfinity/sdk/releases/download/${DFX_VERSION}/dfx-${DFX_VERSION}-x86_64-linux.tar.gz" -o /tmp/dfx.tar.gz
          tar -xzf /tmp/dfx.tar.gz -C /usr/local/bin
          rm /tmp/dfx.tar.gz
          dfx --version

      - name: Install realms CLI + build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e cli/

      - name: Configure dfx identity (Casals CI key)
        env:
          # Publishing uploads artifacts to the file_registry; the key must be
          # a registry publisher there (Casals grant_registry_publisher).
          # Falls back to IC_IDENTITY_PEM.
          CASALS_CI_PEM: ${{ secrets.CASALS_CI_PEM }}
          IC_IDENTITY_PEM: ${{ secrets.IC_IDENTITY_PEM }}
        run: |
          PEM="${CASALS_CI_PEM:-$IC_IDENTITY_PEM}"
          if [ -z "$PEM" ]; then
            echo "::error::Neither CASALS_CI_PEM nor IC_IDENTITY_PEM is set." >&2
            exit 1
          fi
          printf '%s' "$PEM" > /tmp/identity.pem
          chmod 600 /tmp/identity.pem
          dfx identity import ci /tmp/identity.pem --storage-mode=plaintext --force
          dfx identity use ci
          rm -f /tmp/identity.pem
          echo "DFX_WARNING=-mainnet_plaintext_identity" >> "$GITHUB_ENV"
          echo "publish identity principal: $(dfx identity get-principal)"

      - name: Build + publish
        run: |
          ARGS=(
            --environment "${{ inputs.environment }}"
            --family "${{ inputs.family }}"
            --component "${{ inputs.component }}"
            --identity ci
          )
          if [ "${{ inputs.from_main }}" = "true" ]; then
            ARGS+=(--from-main)
          else
            if [ -z "${{ inputs.version }}" ]; then
              echo "::error::version is required unless from_main is true" >&2
              exit 1
            fi
            ARGS+=(--version "${{ inputs.version }}")
          fi
          if [ -n "${{ inputs.file_registry }}" ]; then
            ARGS+=(--file-registry "${{ inputs.file_registry }}")
          fi
          python3 scripts/publish_build.py "${ARGS[@]}"
